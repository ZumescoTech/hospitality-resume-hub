name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Prepare Cloudflare Pages output
        run: |
          mkdir -p dist/deploy/assets
          cp -r dist/client/assets/. dist/deploy/assets/
          cp -r dist/server/assets/. dist/deploy/assets/
          cp dist/server/server.js dist/deploy/_worker.js

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist/deploy --project-name hospitality-resume-hub --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: cab0badf554c2a6e5d4f09a5587cc937
