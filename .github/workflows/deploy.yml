name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CLARITY_PROJECT_ID: ${{ secrets.VITE_CLARITY_PROJECT_ID }}

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: cab0badf554c2a6e5d4f09a5587cc937

      - name: Set Worker secrets
        # GROQ_API_KEY falls back to the legacy ANTHROPIC_API_KEY repo secret (same Groq key).
        # Once a GROQ_API_KEY secret is added in GitHub repo settings, the fallback can be removed.
        run: |
          echo "${{ secrets.GROQ_API_KEY || secrets.ANTHROPIC_API_KEY }}" | npx wrangler secret put GROQ_API_KEY --name hospitality-resume-hub
          echo "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --name hospitality-resume-hub
          echo "${{ secrets.GOOGLE_SHEETS_LEAD_WEBHOOK_URL }}" | npx wrangler secret put GOOGLE_SHEETS_LEAD_WEBHOOK_URL --name hospitality-resume-hub
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: cab0badf554c2a6e5d4f09a5587cc937
